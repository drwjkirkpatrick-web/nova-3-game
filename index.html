<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA-3 - Space Trading Adventure</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .hud-element {
            position: absolute;
            font-size: 18px;
            text-shadow: 0 0 5px #0ff;
        }
        #credits { top: 10px; left: 10px; }
        #system-name { top: 10px; left: 50%; transform: translateX(-50%); }
        #minimap { top: 10px; right: 10px; width: 150px; height: 100px; background: rgba(0, 0, 0, 0.5); border: 1px solid #0ff; }
        #pause-screen, #game-over-screen, #title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
            display: none;
        }
        .screen-title { font-size: 48px; color: #0ff; text-shadow: 0 0 15px #0ff; margin-bottom: 20px; }
        .screen-subtitle { font-size: 24px; color: #fff; margin-bottom: 40px; }
        .btn {
            padding: 15px 30px;
            font-size: 20px;
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn:hover {
            background: #0ff;
            color: #000;
        }
        /* CRT scanline overlay */
        #crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
        }
        /* Spaceport specific styling (drawn on canvas, but for reference) */
        #spaceport-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 400px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #0ff;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        .spaceport-tab-bar {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #0ff;
        }
        .spaceport-tab {
            padding: 10px 20px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #0ff;
            margin-right: 5px;
        }
        .spaceport-tab.active {
            background: #0ff;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="crt-overlay"></div>

    <div id="ui-overlay">
        <div id="credits" class="hud-element">Credits: 5000</div>
        <div id="system-name" class="hud-element">System: [Name]</div>
        <div id="minimap">
            <canvas id="minimapCanvas"></canvas>
        </div>
    </div>

    <!-- Screens -->
    <div id="title-screen">
        <div class="screen-title">NOVA-3</div>
        <div class="screen-subtitle">A Space Trading Adventure</div>
        <div class="btn" id="start-game-btn">PRESS SPACE TO LAUNCH</div>
    </div>

    <div id="pause-screen">
        <div class="screen-title">PAUSED</div>
        <div class="screen-subtitle">Press P or SPACE to Resume</div>
    </div>

    <div id="game-over-screen">
        <div class="screen-title" id="game-over-title">SHIP DESTROYED</div>
        <div class="screen-subtitle" id="game-over-stats"></div>
        <div class="btn" id="restart-game-btn">PRESS SPACE TO RESTART</div>
    </div>

    <!-- Spaceport UI (Drawn on Canvas but layout helps) -->
    <div id="spaceport-ui">
        <div class="spaceport-tab-bar">
            <div class="spaceport-tab active" data-tab="trade">Trade</div>
            <div class="spaceport-tab" data-tab="shipyard">Shipyard</div>
            <div class="spaceport-tab" data-tab="outfitter">Outfitter</div>
            <div class="spaceport-tab" data-tab="missions">Missions</div>
        </div>
        <div id="spaceport-content">
            <!-- Content dynamically generated by JS -->
        </div>
    </div>

    <script>
        // =========================================================================
        // CORE GAME ENGINE
        // =========================================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');
        const UI = {
            credits: document.getElementById('credits'),
            systemName: document.getElementById('system-name'),
            minimap: document.getElementById('minimap'),
            spaceportUI: document.getElementById('spaceport-ui'),
            titleScreen: document.getElementById('title-screen'),
            pauseScreen: document.getElementById('pause-screen'),
            gameOverScreen: document.getElementById('game-over-screen'),
            startGameBtn: document.getElementById('start-game-btn'),
            restartGameBtn: document.getElementById('restart-game-btn')
        };

        // Game Constants
        const CONFIG = {
            WIDTH: 1000,
            HEIGHT: 700,
            FPS: 60,
            SHIP_SIZE: 10,
            MAX_FUEL: 1000,
            MAX_FUEL_CONSUMPTION: 0.1,
            THRUST_POWER: 0.05,
            ROTATION_SPEED: 0.05,
            MAX_SPEED: 8,
            LASER_SPEED: 10,
            MISSILE_SPEED: 5,
            SHIP_CLASSES: {
                Shuttle: { speed: 3, shields: 50, armor: 10, cargo: 5, cost: 1000, color: '#00FFFF', shape: 'triangle' },
                CargoFreighter: { speed: 2, shields: 80, armor: 30, cargo: 50, cost: 3000, color: '#FFD700', shape: 'square' },
                Fighter: { speed: 6, shields: 40, armor: 5, cargo: 10, cost: 2000, color: '#FF0000', shape: 'triangle' },
                Warship: { speed: 4, shields: 150, armor: 75, cargo: 20, cost: 10000, color: '#800080', shape: 'hexagon' }
            }
        };

        // Game State
        let gameState = {
            credits: 5000,
            ship: null,
            galaxy: null,
            showGalaxyMap: false,
            currentSystem: null,
            playerSystem: null,
            isPaused: true,
            isGameOver: false,
            isSpaceportMode: false,
            lastTime: 0,
            keys: {},
            mouse: { x: 0, y: 0, down: false }
        };

        // =========================================================================
        // UTILITIES & AUDIO
        // =========================================================================

        // Simple random number generator
        const rand = (min, max) => Math.random() * (max - min) + min;

        // Web Audio API Setup
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContext();

        function playSound(type, duration = 0.2, frequency = 440, volume = 0.3) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Apply basic sound characteristics based on type
            if (type === 'laser') {
                oscillator.type = 'sawtooth';
                gainNode.gain.setValueAtTime(volume * 2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValue(0.001, audioContext.currentTime + duration);
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            } else if (type === 'explosion') {
                // Noise burst simulation
                const buffer = audioContext.createBuffer(1, audioContext.sampleRate * duration, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                const gain = audioContext.createGain();
                gain.gain.setValueAtTime(volume * 1.5, audioContext.currentTime);
                gain.gain.exponentialRampToValue(0.001, audioContext.currentTime + duration * 1.5);
                source.connect(gain);
                gain.connect(audioContext.destination);
                source.start(audioContext.currentTime);
            } else if (type === 'engine') {
                // Simple low rumble loop
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(50 + rand(0, 10), audioContext.currentTime);
                gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                // Note: Continuous engine sound is handled in the game loop for throttling
                return; 
            } else if (type === 'ping') {
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                gainNode.gain.exponentialRampToValue(0.001, audioContext.currentTime + 0.1);
                oscillator.frequency.setValueAtTime(800 + Math.random() * 200, audioContext.currentTime);
            }
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        // =========================================================================
        // ENTITY CLASSES
        // =========================================================================

        class Vector {
            constructor(x = 0, y = 0) {
                this.x = x;
                this.y = y;
            }

            add(v) {
                return new Vector(this.x + v.x, this.y + v.y);
            }

            subtract(v) {
                return new Vector(this.x - v.x, this.y - v.y);
            }

            multiply(s) {
                return new Vector(this.x * s, this.y * s);
            }

            normalize() {
                const magnitude = Math.sqrt(this.x * this.x + this.y * this.y);
                if (magnitude > 0) {
                    return new Vector(this.x / magnitude, this.y / magnitude);
                }
                return new Vector(0, 0);
            }

            magnitude() {
                return Math.sqrt(this.x * this.x + this.y * this.y);
            }

            clone() {
                return new Vector(this.x, this.y);
            }
        }

        class Ship {
            constructor(type, x, y) {
                const config = CONFIG.SHIP_CLASSES[type];
                this.type = type;
                this.x = x;
                this.y = y;
                this.angle = 0; // Radians
                this.velocity = new Vector(0, 0);
                this.maxSpeed = config.speed;
                this.thrust = 0;
                this.rotation = 0;
                this.color = config.color;

                // Stats
                this.shields = config.shields;
                this.maxShield = config.shields;
                this.armor = config.armor;
                this.hull = config.armor;
                this.maxHull = config.armor;
                this.cargoCapacity = config.cargo;
                this.cargo = {}; // { commodityName: quantity }

                // Economy
                this.credits = 0;
                this.fuel = CONFIG.MAX_FUEL;
                this.isAlive = true;
                this.isTarget = false;
            }

            applyPhysics(deltaTime) {
                if (!this.isAlive) return;

                // Apply thrust (Acceleration)
                if (this.thrust > 0) {
                    const thrustVector = new Vector(Math.cos(this.angle) * this.thrust, Math.sin(this.angle) * this.thrust);
                    this.velocity = this.velocity.add(thrustVector);
                }

                // Apply drag/friction (simple decay)
                this.velocity = this.velocity.multiply(0.99);

                // Cap speed
                if (this.velocity.magnitude() > this.maxSpeed) {
                    this.velocity = this.velocity.normalize().multiply(this.maxSpeed);
                }

                // Update position
                this.x += this.velocity.x;
                this.y += this.velocity.y;

                // Fuel consumption
                if (this.thrust > 0) {
                    this.fuel -= CONFIG.MAX_FUEL_CONSUMPTION * (this.thrust / CONFIG.THRUST_POWER);
                    if (this.fuel < 0) this.fuel = 0;
                }
            }

            rotate(delta) {
                this.angle += delta;
            }

            draw(ctx) {
                if (!this.isAlive) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // 1. Draw Ship Body
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;

                let points = [];
                if (this.type === 'triangle') {
                    points = [
                        new Vector(0, -CONFIG.SHIP_SIZE * 2), // Nose
                        new Vector(-CONFIG.SHIP_SIZE, CONFIG.SHIP_SIZE), // Bottom Left
                        new Vector(CONFIG.SHIP_SIZE, CONFIG.SHIP_SIZE)  // Bottom Right
                    ];
                } else if (this.type === 'square') {
                    points = [
                        new Vector(0, -CONFIG.SHIP_SIZE * 2),
                        new Vector(-CONFIG.SHIP_SIZE, CONFIG.SHIP_SIZE),
                        new Vector(CONFIG.SHIP_SIZE, CONFIG.SHIP_SIZE),
                        new Vector(0, CONFIG.SHIP_SIZE)
                    ];
                } else if (this.type === 'hexagon') {
                    const r = CONFIG.SHIP_SIZE * 1.5;
                    for (let i = 0; i < 6; i++) {
                        const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
                        points.push(new Vector(r * Math.cos(angle), r * Math.sin(angle)));
                    }
                } else { // default/other
                    points = [new Vector(0, -CONFIG.SHIP_SIZE * 2), new Vector(-CONFIG.SHIP_SIZE, CONFIG.SHIP_SIZE), new Vector(CONFIG.SHIP_SIZE, CONFIG.SHIP_SIZE)];
                }

                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 2. Draw Engine Flame (Thrust)
                if (this.thrust > 0.1) {
                    const flameLength = 15 + this.thrust * 30;
                    const flameColor = this.color === '#FFD700' ? 'orange' : 'red';
                    const gradient = ctx.createRadialGradient(
                        0, CONFIG.SHIP_SIZE, 0, 
                        0, CONFIG.SHIP_SIZE, flameLength
                    );
                    gradient.addColorStop(0, flameColor);
                    gradient.addColorStop(1, 'transparent');

                    ctx.beginPath();
                    ctx.moveTo(0, CONFIG.SHIP_SIZE);
                    ctx.lineTo(flameLength, CONFIG.SHIP_SIZE + 5);
                    ctx.lineTo(flameLength * 0.8, CONFIG.SHIP_SIZE + 15);
                    ctx.lineTo(flameLength * 0.2, CONFIG.SHIP_SIZE + 15);
                    ctx.lineTo(0, CONFIG.SHIP_SIZE + 5);
                    ctx.closePath();
                    ctx.fillStyle = gradient;
                    ctx.fill();
                }
                
                // 3. Draw Shields/Hull indicators (Simple bars near the ship)
                const barY = -CONFIG.SHIP_SIZE * 3;
                const barW = CONFIG.SHIP_SIZE * 4;
                
                // Shields (Blue)
                ctx.fillStyle = `rgba(0, 150, 255, ${this.shields / this.maxShield * 0.8 + 0.2})`;
                ctx.fillRect(-barW/2, barY, barW, 5);
                ctx.strokeStyle = '#0ff';
                ctx.strokeRect(-barW/2, barY, barW, 5);

                // Hull (Green)
                const hullRatio = this.hull / this.maxHull;
                const hullBarWidth = barW * hullRatio;
                ctx.fillStyle = `rgba(0, 255, 0, ${hullRatio})`;
                ctx.fillRect(-barW/2, barY + 10, hullBarWidth, 5);

                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, angle, speed, damage, type) {
                this.x = x;
                this.y = y;
                this.velocity = new Vector(Math.cos(angle) * speed, Math.sin(angle) * speed);
                this.damage = damage;
                this.type = type; // 'laser' or 'missile'
                this.life = 150; // Frames
                this.color = type === 'laser' ? '#0ff' : '#ff0000';
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.life--;
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.type === 'laser') {
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x - this.velocity.x * 2, this.y - this.velocity.y * 2);
                    ctx.lineTo(this.x + this.velocity.x * 2, this.y + this.velocity.y * 2);
                    ctx.fill();
                } else { // Missile (Square)
                    ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
                }
            }
        }

        class Particle {
            constructor(x, y, color, size, velocity) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                this.velocity = velocity;
                this.life = 255;
                this.gravity = 0.05;
            }

            update() {
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.life -= 5;
                this.size *= 0.98;
            }

            draw(ctx) {
                ctx.fillStyle = `rgba(${this.color}, ${this.life/255})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class EnemyShip extends Ship {
            constructor(type, x, y) {
                super(type, x, y);
                this.maxSpeed = 5 + rand(0, 3);
                this.shields = 20 + rand(0, 50);
                this.maxShield = this.shields;
                this.armor = 10;
                this.maxHull = this.armor;
                this.hull = this.maxHull;
                this.isTarget = true;
                this.aiState = 'chase';
                this.attackTimer = 0;
                this.target = gameState.ship;
                this.credits = 0; // Bounty value
            }

            update() {
                if (!this.isAlive) return;

                // Simple AI
                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // Flee if low on shields
                if (this.shields < 20 && distance < 300) {
                    this.aiState = 'flee';
                } else if (distance < 800) {
                    this.aiState = 'chase';
                } else {
                    this.aiState = 'patrol';
                }

                // Movement logic
                if (this.aiState === 'chase') {
                    const angleToTarget = Math.atan2(dy, dx);
                    this.angle = angleToTarget;
                    this.velocity = new Vector(Math.cos(angleToTarget) * 0.05, Math.sin(angleToTarget) * 0.05);
                } else if (this.aiState === 'flee') {
                    const angleAway = Math.atan2(dy, dx) + Math.PI;
                    this.angle = angleAway;
                    this.velocity = new Vector(Math.cos(angleAway) * 0.05, Math.sin(angleAway) * 0.05);
                }

                this.applyPhysics(1); // Use 1 for fixed AI update frequency
                this.attack();
            }

            attack() {
                if (this.aiState === 'chase' && Math.random() < 0.005) {
                    this.fireLaser();
                }
            }

            fireLaser() {
                const laser = new Projectile(this.x, this.y, this.angle, CONFIG.LASER_SPEED, 10, 'laser');
                game.projectiles.push(laser);
            }

            draw(ctx) {
                // Red tint for hostile
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.globalAlpha = 0.9;
                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 2;

                // Draw a smaller, red-tinted version of the ship
                ctx.beginPath();
                // Simplified drawing for enemy
                ctx.moveTo(0, -CONFIG.SHIP_SIZE * 2);
                ctx.lineTo(-CONFIG.SHIP_SIZE * 0.8, CONFIG.SHIP_SIZE);
                ctx.lineTo(CONFIG.SHIP_SIZE * 0.8, CONFIG.SHIP_SIZE);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        }
        
        // =========================================================================
        // GALAXY CLASS (star map for hyperspace navigation)
        // =========================================================================

        class Galaxy {
            constructor(systems) {
                this.systems = systems;
                this.scale = 0.35; // Scale galaxy coords to minimap size
                this.offsetX = 60;
                this.offsetY = 40;
            }

            draw(ctx, currentSystem) {
                // Dark overlay
                ctx.fillStyle = 'rgba(0, 0, 20, 0.92)';
                ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

                // Title
                ctx.fillStyle = '#0ff';
                ctx.font = '28px Courier New';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#0ff';
                ctx.shadowBlur = 10;
                ctx.fillText('GALAXY MAP', CONFIG.WIDTH / 2, 40);
                ctx.shadowBlur = 0;

                // Draw hyperlanes (connections)
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.2)';
                ctx.lineWidth = 1;
                const drawn = new Set();
                for (const sys of this.systems) {
                    for (const conn of sys.connections) {
                        const key = [sys.id, conn.id].sort().join('-');
                        if (drawn.has(key)) continue;
                        drawn.add(key);
                        ctx.beginPath();
                        ctx.moveTo(sys.x * this.scale + this.offsetX, sys.y * this.scale + this.offsetY);
                        ctx.lineTo(conn.x * this.scale + this.offsetX, conn.y * this.scale + this.offsetY);
                        ctx.stroke();
                    }
                }

                // Draw systems
                ctx.font = '14px Courier New';
                ctx.textAlign = 'left';
                for (const sys of this.systems) {
                    const sx = sys.x * this.scale + this.offsetX;
                    const sy = sys.y * this.scale + this.offsetY;
                    const isCurrent = currentSystem && sys.id === currentSystem.id;

                    // System node
                    ctx.beginPath();
                    ctx.arc(sx, sy, isCurrent ? 8 : 5, 0, Math.PI * 2);
                    ctx.fillStyle = isCurrent ? '#0ff' : '#08a';
                    ctx.shadowColor = isCurrent ? '#0ff' : 'transparent';
                    ctx.shadowBlur = isCurrent ? 12 : 0;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // System name
                    ctx.fillStyle = isCurrent ? '#0ff' : '#aaa';
                    ctx.fillText(sys.name, sx + 10, sy + 4);
                }

                // Instructions
                ctx.fillStyle = '#888';
                ctx.font = '16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('Press M to close map', CONFIG.WIDTH / 2, CONFIG.HEIGHT - 30);
            }

            getSystemAt(mx, my) {
                for (const sys of this.systems) {
                    const sx = sys.x * this.scale + this.offsetX;
                    const sy = sys.y * this.scale + this.offsetY;
                    const dx = mx - sx;
                    const dy = my - sy;
                    if (dx * dx + dy * dy < 100) return sys;
                }
                return null;
            }
        }

        // =========================================================================
        // GAME MANAGEMENT
        // =========================================================================

        const game = {
            canvas: canvas,
            ctx: ctx,
            projectiles: [],
            particles: [],
            enemies: [],
            stars: [],
            systems: [],
            
            init() {
                // Setup canvas dimensions
                canvas.width = CONFIG.WIDTH;
                canvas.height = CONFIG.HEIGHT;
                minimapCanvas.width = 150;
                minimapCanvas.height = 100;

                // Initialize game state
                gameState.ship = new Ship('Shuttle', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2);
                this.setupGalaxy();
                this.loadGame();
                
                // Event Listeners
                window.addEventListener('keydown', (e) => {
                    gameState.keys[e.code] = true;
                    if (e.code === 'Space' && gameState.isPaused && !gameState.isGameOver) {
                        this.togglePause();
                    }
                    if (e.code === 'Escape') {
                        this.togglePause();
                    }
                    if (e.code === 'KeyM' && !gameState.isPaused && !gameState.isGameOver) {
                        gameState.showGalaxyMap = !gameState.showGalaxyMap;
                    }
                });
                window.addEventListener('keyup', (e) => {
                    gameState.keys[e.code] = false;
                });
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    gameState.mouse.x = e.clientX - rect.left;
                    gameState.mouse.y = e.clientY - rect.top;
                });
                canvas.addEventListener('mousedown', (e) => {
                    if (gameState.showGalaxyMap && gameState.galaxy) {
                        // Galaxy map click — jump to clicked system
                        const rect = canvas.getBoundingClientRect();
                        const mx = e.clientX - rect.left;
                        const my = e.clientY - rect.top;
                        const target = gameState.galaxy.getSystemAt(mx, my);
                        if (target && target !== gameState.currentSystem) {
                            // Check fuel
                            if (gameState.ship.fuel >= 20) {
                                gameState.ship.fuel -= 20;
                                gameState.currentSystem = target;
                                gameState.ship.x = CONFIG.WIDTH / 2;
                                gameState.ship.y = CONFIG.HEIGHT / 2;
                                gameState.showGalaxyMap = false;
                                this.saveGame();
                            }
                        }
                    } else if (!gameState.isPaused && !gameState.isSpaceportMode) {
                        this.handleCombatInput();
                    } else if (gameState.isSpaceportMode) {
                        this.handleSpaceportClick(e);
                    }
                });
                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const rect = canvas.getBoundingClientRect();
                    gameState.mouse.x = e.touches[0].clientX - rect.left;
                    gameState.mouse.y = e.touches[0].clientY - rect.top;
                    gameState.mouse.down = true;
                    this.handleCombatInput();
                });
                canvas.addEventListener('touchend', () => gameState.mouse.down = false);


                UI.startGameBtn.onclick = () => {
                    gameState.isPaused = false;
                    gameState.isGameOver = false;
                    UI.titleScreen.style.display = 'none';
                    UI.pauseScreen.style.display = 'none';
                    gameState.ship.isAlive = true;
                    this.resetGame();
                    requestAnimationFrame(this.gameLoop.bind(this));
                };
                UI.restartGameBtn.onclick = () => {
                    this.resetGame();
                    requestAnimationFrame(this.gameLoop.bind(this));
                };

                // Spaceport Tab Handler
                document.querySelectorAll('.spaceport-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        const tabName = e.target.dataset.tab;
                        this.switchSpaceportTab(tabName);
                    });
                });

                this.gameLoop();
            },

            resetGame() {
                gameState.credits = 5000;
                gameState.ship = new Ship('Shuttle', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2);
                gameState.galaxy = new Galaxy(this.systems);
                gameState.playerSystem = null;
                gameState.isPaused = true;
                gameState.isGameOver = false;
                gameState.projectiles = [];
                gameState.particles = [];
                gameState.enemies = [];
                this.setupGalaxy(); // Re-initialize systems
                this.saveGame();
                UI.credits.textContent = `Credits: ${gameState.credits}`;
                UI.systemName.textContent = `System: [None]`;
                UI.spaceportUI.style.display = 'none';
                UI.pauseScreen.style.display = 'none';
                UI.gameOverScreen.style.display = 'none';
                UI.titleScreen.style.display = 'none';
                
                // Ensure ship is visible on start
                gameState.ship.isAlive = true;
            },

            togglePause() {
                if (gameState.isGameOver) return;
                gameState.isPaused = !gameState.isPaused;
                UI.pauseScreen.style.display = gameState.isPaused ? 'flex' : 'none';
            },

            handleCombatInput() {
                // Primary Attack (Space/Touch)
                if (gameState.keys['Space'] || gameState.mouse.down) {
                    const ship = gameState.ship;
                    if (ship.isAlive) {
                        const laser = new Projectile(ship.x, ship.y, ship.angle, CONFIG.LASER_SPEED, 10, 'laser');
                        gameState.projectiles.push(laser);
                        playSound('laser');
                    }
                }

                // Targeting (T key)
                if (gameState.keys['KeyT']) {
                    const nearestEnemy = this.findNearestEnemy();
                    if (nearestEnemy) {
                        nearestEnemy.isTarget = true;
                        // In a real game, this would lock the crosshair/aim
                    }
                }
            },

            findNearestEnemy() {
                let nearest = null;
                let minDistanceSq = Infinity;

                for (const enemy of gameState.enemies) {
                    if (!enemy.isAlive) continue;
                    const dx = enemy.x - gameState.ship.x;
                    const dy = enemy.y - gameState.ship.y;
                    const distSq = dx * dx + dy * dy;

                    if (distSq < minDistanceSq) {
                        minDistanceSq = distSq;
                        nearest = enemy;
                    }
                }
                return nearest;
            },
            
            handleSpaceportClick(e) {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                // Simple hit detection for spaceport buttons (simplified)
                if (gameState.spaceportUI.style.display === 'flex' && gameState.spaceportMode) {

                    // For now, we just assume the first button is a "Buy Commodity" action.
                    if (clickX > 50 && clickY > 50 && clickX < 200 && clickY < 100) {

                        this.buyShip(gameState.playerSystem);

                }
            },

            // =========================================================================
            // GAME MECHANICS IMPLEMENTATION
            // =========================================================================

            setupGalaxy() {
                gameState.systems = [];
                const systemNames = ["Sol", "Alpha Centauri", "Orion", "Cygnus", "Andromeda", "Void", "Nebula-7"];
                const centers = [
                    { x: 100, y: 100 }, { x: 800, y: 100 }, { x: 500, y: 50 },
                    { x: 100, y: 600 }, { x: 900, y: 600 }, { x: 50, y: 500 },
                    { x: 950, y: 500 }
                ];

                for (let i = 0; i < systemNames.length; i++) {
                    const center = centers[i];
                    const system = {
                        id: i,
                        name: systemNames[i],
                        x: center.x,
                        y: center.y,
                        connections: [], // Stores connections to other systems
                        priceModifier: rand(0.8, 1.2),
                        isPlanet: true,
                        commodities: {
                            food: rand(10, 30),
                            metals: rand(5, 20),
                            medicine: rand(1, 10),
                            tech: rand(2, 15),
                            luxury: rand(0.5, 5),
                            contraband: rand(1, 5)
                        }
                    };
                    gameState.systems.push(system);
                }

                // Connect systems (simple mesh)
                for (let i = 0; i < gameState.systems.length; i++) {
                    for (let j = i + 1; j < gameState.systems.length; j++) {
                        // Connect every system to every other system
                        gameState.systems[i].connections.push(gameState.systems[j]);
                        gameState.systems[j].connections.push(gameState.systems[i]);
                    }
                }
                gameState.galaxy = new Galaxy(gameState.systems);
                gameState.currentSystem = gameState.systems[0]; // Start at Sol
            },

            buyShip(system, type = null) {
                if (type) {
                    gameState.ship = new Ship(type, gameState.ship.x, gameState.ship.y);
                } else {
                    // Logic for buying a new ship at the current location
                    const shipType = 'Shuttle'; // Default if not specified
                    const config = CONFIG.SHIP_CLASSES[shipType];
                    if (gameState.credits >= config.cost) {
                        gameState.credits -= config.cost;
                        gameState.ship = new Ship(shipType, gameState.ship.x, gameState.ship.y);
                        alert(`Purchased ${shipType}!`);
                    } else {
                        alert("Not enough credits!");
                    }
                }
                this.saveGame();
            },

            buyCommodity(system) {
                // Simple logic: buy 1 unit of food if cargo space allows
                const ship = gameState.ship;
                const commodity = 'food';
                const currentCargo = ship.cargo[commodity] || 0;
                const availableSpace = ship.cargoCapacity - Object.values(ship.cargo).reduce((a, b) => a + b, 0);

                if (availableSpace > 0 && ship.credits >= 100) {
                    const price = Math.round(100 * system.priceModifier);
                    ship.cargo[commodity] = (currentCargo || 0) + 1;
                    ship.credits -= price;
                    alert(`Bought 1 unit of ${commodity} for ${price} credits.`);
                    this.saveGame();
                } else {
                    alert("Cannot buy: Cargo full or not enough credits.");
                }
            },

            sellCommodity(system) {
                // Simple logic: sell 1 unit of food if owned
                const ship = gameState.ship;
                const commodity = 'food';
                const currentCargo = ship.cargo[commodity] || 0;

                if (currentCargo > 0) {
                    const price = Math.round(200 * system.priceModifier);
                    ship.cargo[commodity] -= 1;
                    if (ship.cargo[commodity] === 0) delete ship.cargo[commodity];
                    ship.credits += price;
                    alert(`Sold 1 unit of ${commodity} for ${price} credits.`);
                    this.saveGame();
                } else {
                    alert("Nothing to sell.");
                }
            },

            upgradeShip(cost) {
                if (gameState.credits >= cost) {
                    gameState.credits -= cost;
                    // Simplified upgrade: increase shields and cargo
                    gameState.ship.maxShield += 10;
                    gameState.ship.shields = Math.min(gameState.ship.maxShield, gameState.ship.shields + 10);
                    gameState.ship.cargoCapacity += 5;
                    alert("Ship upgraded successfully!");
                    this.saveGame();
                } else {
                    alert("Not enough credits for upgrade.");
                }
            },

            // --- Galaxy and Movement ---

            handleMovement() {
                const ship = gameState.ship;
                if (!ship || ship.isPaused || ship.isGameOver) return;

                // Rotation
                if (gameState.keys['ArrowLeft'] || gameState.keys['KeyA']) {
                    ship.rotate(-CONFIG.ROTATION_SPEED);
                }
                if (gameState.keys['ArrowRight'] || gameState.keys['KeyD']) {
                    ship.rotate(CONFIG.ROTATION_SPEED);
                }

                // Thrust / Reverse
                let thrustValue = 0;
                if (gameState.keys['ArrowUp'] || gameState.keys['KeyW']) {
                    thrustValue = CONFIG.THRUST_POWER;
                } else if (gameState.keys['ArrowDown'] || gameState.keys['KeyS']) {
                    thrustValue = -CONFIG.THRUST_POWER * 0.5; // Reverse thrust
                }
                ship.thrust = thrustValue;

                // Apply physics
                ship.applyPhysics(1); // Delta time simplified to 1 frame for physics stability

                // Fuel check
                if (ship.fuel <= 0 && ship.thrust > 0.1) {
                    ship.thrust = 0;
                    ship.velocity = ship.velocity.multiply(0.99);
                    playSound('ping');
                    // Display low fuel warning
                }

                // Check boundaries (wrap around)
                if (ship.x < 0) ship.x = CONFIG.WIDTH;
                if (ship.x > CONFIG.WIDTH) ship.x = 0;
                if (ship.y < 0) ship.y = CONFIG.HEIGHT;
                if (ship.y > CONFIG.HEIGHT) ship.y = 0;

                // Check Planet Landing proximity (Simplified)
                const nearestPlanet = this.findNearestPlanet(ship);
                if (nearestPlanet && ship.velocity.magnitude() < 0.5 && ship.distanceTo(nearestPlanet) < 150) {
                    // Prompt for landing
                    if (gameState.keys['KeyL'] || gameState.mouse.down) {
                        this.land(nearestPlanet);
                    }
                }
            },

            findNearestPlanet(ship) {
                let nearest = null;
                let minDistanceSq = Infinity;

                for (const system of gameState.systems) {
                    if (system.isPlanet) {
                        const dx = system.x - ship.x;
                        const dy = system.y - ship.y;
                        const distSq = dx * dx + dy * dy;

                        if (distSq < minDistanceSq) {
                            minDistanceSq = distSq;
                            nearest = system;
                        }
                    }
                }
                return nearest;
            },

            distanceTo(system) {
                const dx = system.x - this.x;
                const dy = system.y - this.y;
                return Math.sqrt(dx * dx + dy * dy);
            },
            
            land(system) {
                gameState.isSpaceportMode = true;
                gameState.playerSystem = system;
                UI.spaceportUI.style.display = 'flex';
                UI.systemName.textContent = `System: ${system.name} (LANDED)`;
                this.switchSpaceportTab('trade'); // Default tab

                // Stop ship movement
                gameState.ship.velocity = new Vector(0, 0);
                gameState.ship.thrust = 0;
                playSound('landing');
            },

            // --- Combat ---

            handleCombat() {
                const ship = gameState.ship;
                if (!ship || ship.isPaused || ship.isGameOver) return;

                // Update projectiles
                for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
                    const proj = gameState.projectiles[i];
                    proj.update();

                    // Collision detection (Projectile vs Enemy)
                    for (let j = gameState.enemies.length - 1; j >= 0; j--) {
                        const enemy = gameState.enemies[j];
                        if (!enemy.isAlive) continue;

                        const dx = proj.x - enemy.x;
                        const dy = proj.y - enemy.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < CONFIG.SHIP_SIZE * 3) { // Simple hit radius
                            enemy.shields -= proj.damage;
                            playSound('ping');
                            
                            // Create impact particles
                            for(let k=0; k<5; k++) {
                                const angle = Math.random() * Math.PI * 2;
                                const speed = rand(1, 4);
                                const vel = new Vector(Math.cos(angle) * speed, Math.sin(angle) * speed);
                                gameState.particles.push(new Particle(enemy.x, enemy.y, '255, 255, 255', 3, vel));
                            }

                            if (enemy.shields <= 0) {
                                enemy.shields = 0;
                                enemy.isAlive = false;
                                gameState.credits += 500; // Reward
                                playSound('explosion', 0.5, 100, 0.5);
                            }
                            break; // Projectile hit something, remove it
                        }
                    }

                    // Check if projectile expired
                    if (proj.life <= 0) {
                        gameState.projectiles.splice(i, 1);
                    }
                }
            },

            // --- Rendering ---

            drawStars() {
                // Layer 1 (Fast, close)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 300; i++) {
                    const x = (i * 100 % 2000) - 1000;
                    const y = (i * 50 % 1000) - 500;
                    const size = rand(0.5, 1.5);
                    ctx.fillRect(x, y, size, size);
                }

                // Layer 2 (Medium)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                for (let i = 0; i < 100; i++) {
                    const x = rand(0, CONFIG.WIDTH);
                    const y = rand(0, CONFIG.HEIGHT);
                    const size = rand(0.2, 0.8);
                    ctx.fillRect(x, y, size, size);
                }
                
                // Layer 3 (Slow, background) - Nebula simulation
                const gradient = ctx.createRadialGradient(CONFIG.WIDTH/2, CONFIG.HEIGHT/2, 100, CONFIG.WIDTH/2, CONFIG.HEIGHT/2, 800);
                gradient.addColorStop(0, 'rgba(75, 0, 130, 0.1)'); // Purple
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
            },

            drawHUD() {
                const ship = gameState.ship;
                
                // Credits
                UI.credits.textContent = `Credits: ${Math.floor(ship.credits).toLocaleString()}`;
                
                // System Name
                UI.systemName.textContent = `System: ${gameState.playerSystem ? gameState.playerSystem.name : 'Warp Space'}`;

                // Ship Status (HUD elements drawn on canvas for better integration)
                const HUD_Y = 20;
                const HUD_X = 20;
                const barWidth = 150;
                const barHeight = 10;
                const spacing = 15;

                // Shields
                const sRatio = ship.shields / ship.maxShield;
                const sX = HUD_X;
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(sX, HUD_Y, barWidth, barHeight);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(sX, HUD_Y, barWidth * sRatio, barHeight);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(sX, HUD_Y, barWidth, barHeight);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Courier New';
                ctx.fillText(`SHIELDS: ${Math.floor(sRatio * 100)}%`, sX + 5, HUD_Y + 10);


                // Armor/Hull
                const hRatio = ship.hull / ship.maxHull;
                const hX = sX + barWidth + spacing;
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(hX, HUD_Y, barWidth, barHeight);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(hX, HUD_Y, barWidth * hRatio, barHeight);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(hX, HUD_Y, barWidth, barHeight);
                ctx.fillStyle = '#fff';
                ctx.fillText(`HULL: ${Math.floor(hRatio * 100)}%`, hX + 5, HUD_Y + 10);

                // Fuel
                const fRatio = ship.fuel / CONFIG.MAX_FUEL;
                const fX = hX + barWidth + spacing;
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(fX, HUD_Y, barWidth, barHeight);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(fX, HUD_Y, barWidth * fRatio, barHeight);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(fX, HUD_Y, barWidth, barHeight);
                ctx.fillStyle = '#fff';
                ctx.fillText(`FUEL: ${Math.floor(fRatio * 100)}%`, fX + 5, HUD_Y + 10);

                // Draw minimap (handled separately)
            },

            drawMinimap() {
                minimapCtx.fillStyle = '#000';
                minimapCtx.fillRect(0, 0, 150, 100);

                const mapScale = 150 / (CONFIG.WIDTH * 0.5); // Scale factor
                const center = new Vector(75, 50); // Center of minimap

                // Draw all systems
                gameState.systems.forEach(system => {
                    const scaledX = (system.x - CONFIG.WIDTH / 2) * mapScale + 75;
                    const scaledY = (system.y - CONFIG.HEIGHT / 2) * mapScale + 50;

                    minimapCtx.beginPath();
                    minimapCtx.arc(scaledX, scaledY, 4, 0, Math.PI * 2);
                    minimapCtx.fillStyle = system === gameState.playerSystem ? '#0ff' : '#aaa';
                    minimapCtx.fill();
                    minimapCtx.strokeStyle = '#000';
                    minimapCtx.stroke();
                });

                // Draw Player Ship
                const scaledShipX = (gameState.ship.x - CONFIG.WIDTH / 2) * mapScale + 75;
                const scaledShipY = (gameState.ship.y - CONFIG.HEIGHT / 2) * mapScale + 50;

                minimapCtx.fillStyle = '#0ff';
                minimapCtx.beginPath();
                minimapCtx.arc(scaledShipX, scaledShipY, 3, 0, Math.PI * 2);
                minimapCtx.fill();

                // Draw enemies
                gameState.enemies.forEach(enemy => {
                    if (enemy.isAlive) {
                        const scaledX = (enemy.x - CONFIG.WIDTH / 2) * mapScale + 75;
                        const scaledY = (enemy.y - CONFIG.HEIGHT / 2) * mapScale + 50;
                        minimapCtx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                        minimapCtx.fillRect(scaledX - 2, scaledY - 2, 4, 4);
                    }
                });
            },

            draw() {
                this.ctx.clearRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

                // 1. Draw background (Stars/Nebula)
                this.drawStars();

                // 2. Draw entities
                // Projectiles
                this.projectiles.forEach(p => p.draw(this.ctx));
                // Particles (Explosions/Thrust)
                this.particles.forEach(p => p.draw(this.ctx));
                // Enemies
                this.enemies.forEach(e => e.draw(this.ctx));
                // Player Ship
                if (gameState.ship && gameState.ship.isAlive) {
                    gameState.ship.draw(this.ctx);
                }
                
                // 3. Draw UI
                this.drawHUD();
                this.drawMinimap();

                // 4. Draw galaxy map if open
                if (gameState.showGalaxyMap && gameState.galaxy) {
                    gameState.galaxy.draw(this.ctx, gameState.currentSystem);
                }
            },

            // --- Game Loop ---

            gameLoop(timestamp) {
                const deltaTime = timestamp - gameState.lastTime;
                gameState.lastTime = timestamp;

                if (!gameState.isPaused && !gameState.isGameOver) {
                    // Update Logic
                    this.handleMovement();
                    this.handleCombat();
                    this.updateEntities();

                    // Check Game Over
                    if (gameState.ship.shields <= 0 && gameState.ship.hull <= 0) {
                        gameState.ship.isAlive = false;
                        gameState.isGameOver = true;
                        this.showGameOver();
                    }
                }
                
                // Render Logic
                this.draw();

                requestAnimationFrame(this.gameLoop.bind(this));
            },

            updateEntities() {
                // Update projectiles
                gameState.projectiles = gameState.projectiles.filter(p => {
                    p.update();
                    return p.life > 0;
                });

                // Update particles
                gameState.particles = gameState.particles.filter(p => {
                    p.update();
                    return p.life > 0 && p.size > 0.5;
                });

                // Update enemies
                gameState.enemies = gameState.enemies.filter(e => {
                    e.update();
                    return e.isAlive;
                });
            },

            },

            spawnEnemy() {
                const types = ['Fighter', 'Warship'];
                const type = types[Math.floor(Math.random() * types.length)];
                const x = rand(0, CONFIG.WIDTH);
                const y = rand(0, CONFIG.HEIGHT);
                const enemy = new EnemyShip(type, x, y);
                gameState.enemies.push(enemy);
            }
        };

        // Initialize the game when the script loads
        game.init();

    </script>
